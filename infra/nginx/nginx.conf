upstream syntaxis_builder { server syntaxis-builder:8081; }
upstream dashboard_ui     { server dashboard:8080; }
upstream gateway           { server gateway-api:3000; }
upstream identity          { server identity-service:3001; }
upstream consent           { server consent-service:3002; }
upstream governance        { server governance-engine:3003; }
upstream decision          { server decision-forge:3004; }
upstream crosscheck        { server crosscheck-adapter:3005; }
upstream provenance        { server provenance-writer:3006; }
upstream audit             { server audit-api:3007; }
upstream notification      { server notification-service:3008; }
upstream policy            { server policy-distribution:3009; }
upstream syntaxis          { server syntaxis-orchestrator:3010; }
upstream caip              { server caip-engine:3011; }

# ── HTTP → HTTPS redirect ─────────────────────────────────────
server {
    listen 80;
    server_name cto.systems www.cto.systems;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS server ──────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name cto.systems www.cto.systems;

    ssl_certificate     /etc/letsencrypt/live/cto.systems/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cto.systems/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 10M;

    # ── Syntaxis Builder (main UI) ────────────────────────────
    location / {
        proxy_pass http://syntaxis_builder;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Dashboard ─────────────────────────────────────────────
    location /dashboard/ {
        rewrite ^/dashboard/(.*) /$1 break;
        proxy_pass http://dashboard_ui;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Gateway API ───────────────────────────────────────────
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Service APIs (direct access) ─────────────────────────
    location /api/identity/ {
        rewrite ^/api/identity/(.*) /$1 break;
        proxy_pass http://identity;
    }
    location /api/consent/ {
        rewrite ^/api/consent/(.*) /$1 break;
        proxy_pass http://consent;
    }
    location /api/governance/ {
        rewrite ^/api/governance/(.*) /$1 break;
        proxy_pass http://governance;
    }
    location /api/decision/ {
        rewrite ^/api/decision/(.*) /$1 break;
        proxy_pass http://decision;
    }
    location /api/crosscheck/ {
        rewrite ^/api/crosscheck/(.*) /$1 break;
        proxy_pass http://crosscheck;
    }
    location /api/provenance/ {
        rewrite ^/api/provenance/(.*) /$1 break;
        proxy_pass http://provenance;
    }
    location /api/audit/ {
        rewrite ^/api/audit/(.*) /$1 break;
        proxy_pass http://audit;
    }
    location /api/notification/ {
        rewrite ^/api/notification/(.*) /$1 break;
        proxy_pass http://notification;
    }
    location /api/policy/ {
        rewrite ^/api/policy/(.*) /$1 break;
        proxy_pass http://policy;
    }
    location /api/syntaxis/ {
        rewrite ^/api/syntaxis/(.*) /$1 break;
        proxy_pass http://syntaxis;
    }
    location /api/caip/ {
        rewrite ^/api/caip/(.*) /$1 break;
        proxy_pass http://caip;
    }
}
