[package]
name = "exochain-wasm"
version = "0.1.0"
edition = "2021"
description = "WASM bindings for ExoChain governance engine"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.100"
serde = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
getrandom = { workspace = true }

# ExoChain crates (Tier 1 — fully WASM-compatible)
exo-core = { workspace = true }
exo-gatekeeper = { workspace = true }
exo-governance = { workspace = true }
exo-consent = { workspace = true }
exo-authority = { workspace = true }
exo-legal = { workspace = true }
exo-escalation = { path = "../exo-escalation" }
exo-identity = { workspace = true }
decision-forum = { path = "../decision-forum" }

chrono = { workspace = true }
hex = { workspace = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }

[profile.release]
opt-level = "s"
lto = true
